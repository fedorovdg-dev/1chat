name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Клиент ставят на чужие серверы, где версия Node какая есть.
      # Проверяем на минимально поддерживаемой (встроенный SQLite без флага
      # появился в 22.13) и на текущих.
      matrix:
        node: ['22.13', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Каждый файл отдельно и с пределом времени: зависание должно становиться
      # падением с названием теста, а не шестичасовым простоем. Упавшее
      # выводится аннотациями — их видно без доступа к логам.
      - name: Тесты
        run: |
          status=0
          for f in test/*.test.js; do
            start=$(date +%s)
            if ! timeout 120 node --test --test-reporter=spec --test-timeout=60000 "$f" > out.txt 2>&1; then
              status=1
              echo "::error title=$f::упал за $(( $(date +%s) - start )) с"
              grep -E "✖|timed out|Error|expected|actual" out.txt | head -20 | while IFS= read -r line; do
                echo "::error title=$f::$line"
              done
            fi
            echo "$f — $(( $(date +%s) - start )) с"
            cat out.txt
          done
          exit $status

  # Проверяем, что в пакет не уедет лишнее. Это не про размер: клиент
  # держит чужие API-ключи, и всё, что в нём лежит, окажется на чужих
  # машинах.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Состав пакета
        run: npm pack --dry-run
      - name: В пакете нет ничего, кроме кода и описания
        run: |
          npm pack --json > /tmp/pack.json
          node -e "
            const files = require('/tmp/pack.json')[0].files.map(f => f.path)
            const allowed = /^(src\/|README\.md$|package\.json$|LICENSE$)/
            const extra = files.filter(f => !allowed.test(f))
            if (extra.length) {
              console.error('Лишнее в пакете:', extra)
              process.exit(1)
            }
            console.log('файлов:', files.length)
          "
