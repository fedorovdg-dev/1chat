name: Publish

# Публикуем по тегу, а не по каждому пушу в main: версия в npm неизменяема,
# и случайная публикация не откатывается, а только перебивается следующей.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Нужен для trusted publishing: npm выдаёт короткоживущий токен
      # в обмен на этот, и долгоживущего секрета, который можно украсть,
      # в репозитории не существует вовсе.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Без `registry-url`: он создаёт .npmrc со строкой авторизации из
      # NODE_AUTH_TOKEN, а её у нас нет — и npm отправляет пустой токен вместо
      # того, чтобы получить настоящий через пайплайн. Отвечает на это реестр
      # кодом 404, ничего не объясняя: так он скрывает, существует ли пакет со
      # скоупом, от неавторизованного запроса.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      - name: Версия в теге совпадает с версией в package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Тег v$TAG не совпадает с версией пакета $PKG" >&2
            exit 1
          fi

      # Публикуем через `npx npm@latest`, а не через установленный npm.
      # Обмен токена пайплайна на токен реестра умеет только свежий npm, а
      # глобальная установка на раннере не всегда перекрывает встроенный —
      # так версия гарантирована.
      #
      # Диагностика печатается здесь же: прошлый раз она была отдельным шагом,
      # и в отчёт об ошибке попадал только вывод публикации, без неё.
      - name: Публикация
        run: |
          echo "── окружение ──────────────────────────────"
          echo "npm по умолчанию : $(npm --version)"
          echo "npm для публикации: $(npx -y npm@latest --version)"
          echo "токен пайплайна  : ${ACTIONS_ID_TOKEN_REQUEST_URL:+есть}${ACTIONS_ID_TOKEN_REQUEST_URL:-НЕТ}"
          echo "репозиторий      : $GITHUB_REPOSITORY"
          echo "файл процесса    : ${GITHUB_WORKFLOW_REF%%@*}"
          echo "настройки npm    :"
          cat ~/.npmrc 2>/dev/null || echo "  (.npmrc нет — так и надо)"
          echo "───────────────────────────────────────────"
          npx -y npm@latest publish --access public
